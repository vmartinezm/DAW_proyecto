<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel principal - Concesionario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Concesionario Martínez</h1>
            <h2>Panel principal</h2>
        </div>

        <div id="alertaBienvenida" class="alerta"></div>

        <div class="panel-acciones">
            <button class="dash-btn" id="dashBtnVehiculos">🚗 Vehículos</button>
            <button class="dash-btn" id="dashBtnMantenimientos">🛠 Mantenimientos</button>
            <button class="dash-btn" id="dashBtnVentas">💰 Ventas</button>
            <button class="dash-btn" id="dashBtnClientes">👥 Clientes</button>

            <!-- Solo se mostrará si el usuario es admin -->
            <button class="dash-btn admin-only" id="dashBtnUsuarios">🔐 Usuarios</button>
        </div>

        <button id="dashBtnLogout" class="logout-btn">Cerrar sesión</button>
    </div>

    <script src="js/dashboard.js" type="module"></script>
</body>

</html>
