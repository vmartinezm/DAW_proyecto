<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios - Concesionario</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <h1>Gestión de Usuarios</h1>

    <div class="panel-acciones">
        <button id="btnAddUsuario">➕ Añadir usuario</button>
        <button id="btnVolverVehiculos">⬅️ Volver a vehículos</button>
    </div>

    <div class="tabla-container">
        <table id="usuariosTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Email</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- 🔹 Modal de formulario -->
    <div id="usuariosModal" class="modal fade">
        <div class="modal-content">
            <span id="cerrarModal" class="close">&times;</span>
            <h2 id="formTitle">Añadir nuevo usuario</h2>

            <form id="usuariosForm">
                <input type="hidden" id="user_id" />

                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required />
                </div>

                <div class="form-row">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" required />
                </div>

                <div class="form-row">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" required />
                </div>

                <div class="form-row">
                    <label for="rol">Rol:</label>
                    <select id="rol" required>
                        <option value="admin">Administrador</option>
                        <option value="empleado" selected>Empleado</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required />
                </div>

                <div class="form-row" id="grupoCreado">
                    <label for="creado_at">Creado:</label>
                    <input type="text" id="creado_at" />
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/usuarios.js"></script>
</body>

</html>
