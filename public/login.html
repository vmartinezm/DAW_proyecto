<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionario - Login</title>
    <link rel="stylesheet" href="css/styles.css">

    <!--  
        🔐 Esta página se usa para iniciar sesión
        Punto importante:
        - el usuario aún NO está autenticado
        - no debe cargar JS de la app privada
        - debe ser lo más ligera posible
    -->
</head>

<body>

    <h1>Concesionario Martínez</h1>

    <div class="login-container">

        <!-- 
            Formulario de login.
            El usuario se identifica con:
            - usuario (nombre de usuario)
            - password (contraseña)
        -->
        <div class="panel-acciones login-menu">
            <form id="loginForm" class="login-form" autocomplete="off">

                <h3>Iniciar sesión</h3>

                <div class="form-row">
                    <label for="usuario">Usuario:</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        required
                        minlength="3"
                        maxlength="50"
                        autocomplete="off"
                    >
                </div>

                <div class="form-row">
                    <label for="password">Contraseña:</label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        minlength="3"
                        maxlength="100"
                        autocomplete="off"
                    >
                </div>

                <div class="form-row form-buttons-container">
                    <button type="submit">Entrar</button>
                </div>
            </form>

        </div>

        <!-- 
            Mensaje de error mostrado al usuario 
            (credenciales incorrectas / server down / etc)
        -->
        <div id="zonaError">
            <p id="loginError" class="panel-acciones error-msg"></p>
        </div>

    </div>

    <!-- 
        login.js gestiona:
        ✔ envío de credenciales al backend
        ✔ gestión de token y sesión
        ✔ manejo de errores visuales
    -->
    <script src="js/login.js"></script>
</body>

</html>
