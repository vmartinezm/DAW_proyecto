<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Mantenimientos - Concesionario</title>

    <!--
      📌 Hoja de estilos global
      Contiene sistema de botones, tablas y modales
    -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- 🟦 Header de la página -->
    <div class="mantenimientos-header">
        <h1>Concesionario Martínez</h1>
        <h2>Gestión de Mantenimientos</h2>
    </div>

    <!-- 🟧 Botones de navegación y acciones -->
    <div class="panel-acciones">

        <!-- Nuevo mantenimiento -->
        <button id="btnAddMantenimiento">➕ Añadir mantenimiento</button>

        <!-- Retorno al listado de vehículos -->
        <button id="btnVolverVehiculos">⬅️ Ir a vehículos</button>

        <!-- Regreso al panel principal -->
        <button id="btnIrDashboard">🏠 Ir a menú principal</button>
    </div>

    <!-- 🟩 Tabla de mantenimientos -->
    <div class="tabla-container">
        <table id="mantenimientosTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vehículo</th>
                    <th>Fecha inicio</th>
                    <th>Fecha fin</th>
                    <th>Descripción</th>
                    <th>Empleado</th>
                    <th>Coste</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody> <!-- Se genera dinámicamente desde mantenimientos.js -->
        </table>
    </div>

    <!-- 🟥 Modal formulario mantenimiento -->
    <div id="mantenimientoModal" class="modal fade">
        <div class="modal-content">

            <!-- Cerrar ventana -->
            <span id="cerrarModal" class="close">&times;</span>

            <!-- Título dinámico:
                ➕ Añadir mantenimiento 
                ✏️ Editar mantenimiento
            -->
            <h3 id="formTitle">Añadir nuevo mantenimiento</h3>

            <form id="mantenimientoForm">
                
                <!-- ID interno (solo en edición) -->
                <input type="hidden" id="mantenimiento_id">

                <!-- Seleccionar vehículo -->
                <div class="form-row">
                    <label for="vehiculo_id">Vehículo:</label>
                    <select id="vehiculo_id" required></select>
                </div>

                <!-- Fecha de inicio -->
                <div class="form-row">
                    <label for="fecha_inicio">Fecha inicio:</label>
                    <input type="date" id="fecha_inicio" required>
                </div>

                <!-- Fecha fin opcional -->
                <div class="form-row">
                    <label for="fecha_fin">Fecha fin:</label>
                    <input type="date" id="fecha_fin">
                </div>

                <!-- Descripción libre -->
                <div class="form-row">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion"></textarea>
                </div>

                <!-- Coste económico -->
                <div class="form-row">
                    <label for="coste">Coste (€):</label>
                    <input type="number" id="coste" step="0.01">
                </div>

                <!-- Técnico responsable -->
                <div class="form-row">
                    <label for="realizado_por">Empleado:</label>
                    <select id="realizado_por" required></select>
                </div>

                <!-- Fecha de creación (solo modo editar) -->
                <div class="form-row" id="grupoCreado">
                    <label>Creado:</label>
                    <input type="text" id="creado_at" disabled>
                </div>

                <!-- Botones del modal -->
                <div class="form-buttons">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>

            </form>
        </div>
    </div>

    <!-- 🔐 Protección de acceso -->
    <script type="module">
        import { requireLogin } from "./js/auth.js";
        requireLogin();   <!-- Redirige a login si no hay sesión válida -->
    </script>

    <!-- 🧠 Lógica de funcionamiento del módulo -->
    <script src="js/mantenimientos.js"></script>
</body>

</html>
