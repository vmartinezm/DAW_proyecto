<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Mantenimientos - Concesionario</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <div class="mantenimientos-header">
        <h1>Concesionario Martínez</h1>
        <h2>Gestión de Mantenimientos</h2>
    </div>

    <div class="panel-acciones">

        <button id="btnAddMantenimiento">➕ Añadir mantenimiento</button>
        <button id="btnVolverVehiculos">⬅️ Ir a vehículos</button>
        <button id="btnIrDashboard">🏠 Ir a menú principal</button>
    </div>

    <div class="tabla-container">
        <table id="mantenimientosTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vehículo</th>
                    <th>Fecha inicio</th>
                    <th>Fecha fin</th>
                    <th>Descripción</th>
                    <th>Empleado</th>
                    <th>Coste</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- 🔹 Modal -->
    <div id="mantenimientoModal" class="modal fade">
        <div class="modal-content">
            <span id="cerrarModal" class="close">&times;</span>
            <h3 id="formTitle">Añadir nuevo mantenimiento</h3>

            <form id="mantenimientoForm">
                <input type="hidden" id="mantenimiento_id">

                <div class="form-row">
                    <label for="vehiculo_id">Vehículo:</label>
                    <select id="vehiculo_id" required></select>
                </div>

                <div class="form-row">
                    <label for="fecha_inicio">Fecha inicio:</label>
                    <input type="date" id="fecha_inicio" required>
                </div>

                <div class="form-row">
                    <label for="fecha_fin">Fecha fin:</label>
                    <input type="date" id="fecha_fin">
                </div>

                <div class="form-row">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion"></textarea>
                </div>

                <div class="form-row">
                    <label for="coste">Coste (€):</label>
                    <input type="number" id="coste" step="0.01">
                </div>

                <div class="form-row">
                    <label for="realizado_por">Empleado:</label>
                    <select id="realizado_por" required></select>
                </div>

                <div class="form-row" id="grupoCreado">
                    <label>Creado:</label>
                    <input type="text" id="creado_at" disabled>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { requireLogin } from "./js/auth.js";
        requireLogin();
    </script>

    <script src="js/mantenimientos.js"></script>
</body>

</html>
