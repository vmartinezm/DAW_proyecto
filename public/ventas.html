<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concesionario - Gestión Ventas</title>

    <!--
      📌 CSS global
      Contiene estilos de tablas, formularios, botones y modales
    -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- 🟦 Encabezado de la interfaz -->
    <div class="ventas-header">
        <h1>Concesionario Martínez</h1>
        <h2>Gestión de Ventas</h2>
    </div>

    <!-- 🟧 Panel de acciones superiores -->
    <div class="panel-acciones">
        <button id="btnAddVenta">➕ Añadir venta</button>
        <button id="btnVolverVehiculos">⬅️ Ir a vehículos</button>
        <button id="btnIrDashboard">🏠 Ir a menú principal</button>
    </div>

    <!-- 🟩 Tabla de ventas -->
    <div class="tabla-container">
        <table id="ventasTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vehículo ID</th>
                    <th>Cliente DNI</th>
                    <th>Fecha</th>
                    <th>Tipo</th> <!-- venta / reserva -->
                    <th>Precio (€)</th>
                    <th>Vendedor</th>
                    <th>Notas</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <!-- El cuerpo se inyecta dinámicamente desde ventas.js -->
            <tbody></tbody>
        </table>
    </div>

    <!-- 🟥 Modal de creación/edición de ventas -->
    <div id="ventaModal" class="modal fade">
        <div class="modal-content">

            <!-- botón cerrar -->
            <span id="cerrarModal" class="close">&times;</span>

            <!-- cambia dinámicamente:
                 "Añadir nueva venta"
                 "Editar venta" 
            -->
            <h3 id="formTitle">Añadir nueva venta</h3>

            <form id="ventasForm">

                <!-- ID interno (solo edición) -->
                <input type="hidden" id="venta_id" />

                <!-- Selección de vehículo -->
                <div class="form-row">
                    <label for="vehiculo_id">Vehículo:</label>
                    <select id="vehiculo_id" required>
                    </select>
                </div>

                <!-- Selección de cliente -->
                <div class="form-row">
                    <label for="cliente_dni">Cliente:</label>
                    <select id="cliente_dni" required></select>

                    <!-- Se abre mini modal -->
                    <button type="button" id="btnAddCliente" class="btn-crear-cliente">Nuevo cliente</button>
                </div>

                <!-- Fecha operación -->
                <div class="form-row">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required />
                </div>

                <!-- venta o reserva -->
                <div class="form-group">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" required>
                        <option value="venta">Venta</option>
                        <option value="reserva">Reserva</option>
                    </select>
                </div>

                <!-- Precio total -->
                <div class="form-row">
                    <label for="precio">Precio (€):</label>
                    <input type="number" id="precio_venta" step="0.01" />
                </div>

                <!-- Vendedor responsable -->
                <div class="form-row">
                    <label for="vendedor_id">Vendedor:</label>
                    <select id="vendedor_id" required>
                    </select>
                </div>

                <!-- Extra -->
                <div class="form-row">
                    <label for="notas">Notas:</label>
                    <textarea id="notas" rows="3"></textarea>
                </div>

                <!-- Fecha de creación (solo edición) -->
                <div class="form-row" id="grupoCreado">
                    <label for="creado_at">Creado:</label>
                    <input type="text" id="creado_at" />
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>

            </form>
        </div>
    </div>

    <!-- 🟪 Mini modal para crear cliente dentro de ventas -->
    <div id="clienteModal" class="modal">
        <div class="modal-content">

            <!-- cerrar mini modal -->
            <span id="cerrarClienteModal" class="cerrar">&times;</span>
            <h3>Nuevo Cliente</h3>

            <form id="clienteForm">

                <div class="form-group">
                    <label for="cliente_dni_nuevo">DNI:</label>
                    <input type="text" id="cliente_dni_nuevo" required>
                </div>

                <div class="form-group">
                    <label for="cliente_nombre_nuevo">Nombre:</label>
                    <input type="text" id="cliente_nombre_nuevo" required>
                </div>

                <div class="form-group">
                    <label for="cliente_apellidos_nuevo">Apellidos:</label>
                    <input type="text" id="cliente_apellidos_nuevo" required>
                </div>

                <div class="form-group">
                    <label for="cliente_email_nuevo">Email:</label>
                    <input type="email" id="cliente_email_nuevo">
                </div>

                <div class="form-group">
                    <label for="cliente_telefono_nuevo">Teléfono:</label>
                    <input type="text" id="cliente_telefono_nuevo">
                </div>

                <div class="form-group">
                    <label for="cliente_direccion_nuevo">Dirección:</label>
                    <input type="text" id="cliente_direccion_nuevo">
                </div>

                <button type="submit" class="btn-crear-cliente">Crear Cliente</button>
            </form>
        </div>
    </div>

    <!-- 🔐 Requiere sesión activa -->
    <script type="module">
        import { requireLogin } from "./js/auth.js";
        requireLogin();
    </script>

    <!-- 🧠 Controlador frontend de ventas -->
    <script src="js/ventas.js" type="module"></script>
</body>

</html>
