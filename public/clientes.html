<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Clientes - Concesionario</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <h1>Gestión de Clientes</h1>

    <div class="panel-acciones">
        <button id="btnAddCliente">➕ Añadir cliente</button>
        <button id="btnVolverVehiculos">⬅️ Volver a vehículos</button>
    </div>

    <div class="tabla-container">
        <table id="clientesTable">
            <thead>
                <tr>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Creado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- 🔹 Modal de formulario -->
    <div id="clientesModal" class="modal fade">
        <div class="modal-content">
            <span id="cerrarModal" class="close">&times;</span>
            <h2 id="formTitle">Añadir nuevo cliente</h2>

            <form id="usuariosForm">
                <div class="form-row" id="grupoDni">
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" />
                </div>

                <div class="form-row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required />
                </div>

                <div class="form-row">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" required />
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required />
                </div>

                <div class="form-row">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" />
                </div>

                <div class="form-row">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" />
                </div>

                <div class="form-row" id="grupoCreado">
                    <label for="creado_at">Creado:</label>
                    <input type="text" id="creado_at" />
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/clientes.js"></script>
</body>

</html>
